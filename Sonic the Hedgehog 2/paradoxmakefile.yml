# Sonic the Hedgehog 2, the way Sonic Team made it: out of Sonic 1. It starts as Sonic 1's code and resources (reuse:) minus what it replaces (except:), and every file
# it replaces is a step away from Sonic 1 and toward Sonic 2. Paths are relative to this file; reuse's except: paths are relative to the reused project.
# Zone slots for now: GHZ, (empty), CPZ, EHZ, HPZ, HTZ.
project: SonicTheHedgehog2
version: "1.0"
license: TBD            # per-game library: licence is for SEGA to decide
type: game
depends: [ParadoxEngine]
include: [src]
core_library: Sonic2Core
executable: Sonic2
main: src/Main.c      # its own entry point: the ROM header (and so the window title) says SONIC THE HEDGEHOG 2
reuse:
  - project: SonicTheHedgehog
    except:
      - "src/Sonic1Assets.c"    # -> Sonic2Assets.c: the identity (and, for now, the same font and icon)
      - "src/Sonic1Screens.c"   # -> Sonic2Screens.c: the screens by game mode
      - "src/Sonic1Objects.c"   # -> Sonic2Objects.c: the objects by id, replaced one by one with Sonic 2's (Sonic and Tails on the title first)
      - "src/Sonic1Collision.c" # -> Sonic2Collision.c: Sonic 2's solids
      - "src/Sonic1LevelData.c" # -> Sonic2LevelData.c: the zone slots' level data, Emerald Hill's imported from Nick Arcade
      - "src/Sonic1PLC.c"       # -> Sonic2PLC.c: the pattern load cues (Emerald Hill's art at tile 0)
      - "src/Sonic1Palettes.c"  # -> Sonic2Palettes.c: the palettes
      - "src/Level.c"           # -> its own Level.c: Nick Arcade's dynamic level events
      - "src/LevelScroll.c"     # -> its own LevelScroll.c: Nick Arcade's zones' background starts and deformation, and the title screen's
      - "src/LevelDraw.c"       # -> its own LevelDraw.c: the background drawing those zones need
      - "src/PaletteCycle.c"    # -> its own PaletteCycle.c: Emerald Hill's cycle (the title's too)
      - "src/Object/Sonic.c"       # -> its own copy: Nick Arcade's animation code (frames, walking/running sets); Sonic 1's Sonic stays as it was
      - "res/Art/Sonic"            # Sonic's art, mappings, DPLC and animations are Nick Arcade's (res/Art/Sonic, res/Mappings/SonicDPLC, res/Animation/Sonic, asm/Mappings/Sonic.asm)
      - "res/Mappings/Sonic"
      - "res/Mappings/SonicDPLC"
      - "res/Animation/Sonic"
      - "asm/Mappings/Sonic.asm"
      - "asm/Mappings/SonicDPLC.asm"
      - "src/Object/Checkpoint.c" # -> its own: Nick Arcade's lamp post (no twirling ball)
      - "src/Sonic1Sound.c"       # -> its own Sonic2Sound.c: the Simon Wai prototype's sound ids, music and effects (SoundIds.h)
      - "src/Object/Spikes.c"   # -> its own: Nick Arcade's spikes (upright only, palette line 1)
      - "src/Object/Monitor.c"  # -> its own: Nick Arcade's monitors (items renumbered)
      - "src/Object/PathSwapper.c" # -> its own: Nick Arcade's path swapper (both characters, solid bits)
      - "src/Object/Scenery.c"  # -> its own: Nick Arcade's scenery (bridge stakes, orbs, lift poles)
      - "src/LZWaterFeatures.c" # -> its own: Nick Arcade's water (Hidden Palace's), with the underwater ripple
      - "src/Demo.c"            # -> its own: Nick Arcade's attract-mode demos
      - "src/Object/TitleCard.c" # -> its own: Nick Arcade's level order for the end-of-act card
      - "src/Object/Signpost.c" # -> its own: Nick Arcade's signpost (art, mappings, animation, sparkles)
      - "res/Art/Signpost"
      - "res/Mappings/Signpost"
      - "res/Animation/Signpost"
      - "asm/Mappings/Signpost.asm"
      - "src/Object/BasicPlatform.c" # -> src/Object/Platform.c: Nick Arcade's platforms
      - "src/Object/Spring.c"   # -> its own: Nick Arcade's springs (all five directions, Sonic and Tails, flips)
      - "src/Object/ShieldInvincibility.c" # -> its own: Nick Arcade's barrier (wider, Emerald Hill's art place) and unfinished invincibility stars
      - "res/Animation/ShieldInvincibility"
      - "res/Animation/Spring"
      - "res/Mappings/Spring"
      - "asm/Mappings/Spring.asm"
      - "res/Animation/Monitor"
      - "src/HUD.c"             # -> its own HUD.c: no time over kill
      - "res/Art/HUD"           # the HUD's art, lives counter art and digits are Nick Arcade's
      - "res/Art/HUDLife"
      - "res/Art/HUDNum"
      # the common objects' art and mappings are Nick Arcade's (res/Art, res/Mappings, asm/Mappings)
      - "res/Art/Ring"
      - "res/Art/Points"
      - "res/Art/Monitor"
      - "res/Art/Spikes"
      - "res/Art/Lamppost"
      - "res/Art/Shield"
      - "res/Art/Invincibility"
      - "res/Mappings/RingREV01"
      - "res/Mappings/Monitor"
      - "res/Mappings/Spikes"
      - "res/Mappings/Points"
      - "res/Mappings/Checkpoint"
      - "res/Mappings/ShieldInvincibility"
      - "asm/Mappings/RingREV01.asm"
      - "asm/Mappings/Monitor.asm"
      - "asm/Mappings/Spikes.asm"
      - "asm/Mappings/Points.asm"
      - "asm/Mappings/Checkpoint.asm"
      - "asm/Mappings/ShieldInvincibility.asm"
      - "res/Mappings/HUD"      # the HUD mapping: Sonic 1's layout (widescreen frames included) with Nick Arcade's palettes (normal and flashing swapped)
      - "asm/Mappings/HUD.asm"
      - "src/GM_Title.c"        # -> its own GM_Title.c: Start begins in Emerald Hill, the level select cheat is always on
