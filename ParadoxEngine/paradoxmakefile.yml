# ParadoxEngine: the common core of every Paradox game (hardware model, codecs, sound driver, host window).
# Built by ParadoxMake (qmake-style: run "paradoxmake" in a project folder). Paths are relative to this file.
project: ParadoxEngine
version: "1.0"
license: MIT
type: shared-library
include: [src]            # exported to every project that depends on this one
resource_dir: res         # files under "resources:" are converted to C headers (bin2h) ...
resource_out: src/Resource  # ... generated here
cmake: paradoxmake.cmake  # parts not yet declarative (backends, SMPS tools, install)
sources:
